
name: Extract TubePilot Starter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          mkdir -p /tmp/tubepilot
          unzip -o TubePilot_Studio_Starter.zip -d /tmp/tubepilot
          cp -R /tmp/tubepilot/. .

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md pubspec.yaml analysis_options.yaml lib
          git diff --cached --quiet || git commit -m "Add TubePilot Flutter starter project"
          git push
